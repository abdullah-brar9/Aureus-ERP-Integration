name: aureuserp

x-app-build: &app-build
  context: .
  dockerfile: docker/production/Dockerfile
  target: app
  args:
    PHP_VERSION: "${DOCKER_PHP_VERSION:-8.3}"
    NODE_VERSION: "${DOCKER_NODE_VERSION:-22}"

x-app-service: &app-service
  image: "aureuserp/app:${DOCKER_IMAGE_TAG:-local}"
  build: *app-build
  env_file:
    - .env
  environment:
    APP_URL: "${APP_URL:-http://localhost:8080}"
    ASSET_URL: "${ASSET_URL:-}"
    FORCE_HTTPS: "${FORCE_HTTPS:-false}"
    SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-false}"
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    CACHE_STORE: "${CACHE_STORE:-database}"
    QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
    SESSION_DRIVER: "${SESSION_DRIVER:-database}"
  volumes:
    - app-storage:/var/www/html/storage
  networks:
    - backend
  depends_on:
    mysql:
      condition: service_healthy
      restart: true
  restart: unless-stopped
  init: true

services:
  app:
    <<: *app-service
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET
          cgi-fcgi -bind -connect 127.0.0.1:9000 2>/dev/null | grep -q pong
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  nginx:
    image: "aureuserp/nginx:${DOCKER_IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: docker/production/Dockerfile
      target: web
      args:
        PHP_VERSION: "${DOCKER_PHP_VERSION:-8.3}"
        NODE_VERSION: "${DOCKER_NODE_VERSION:-22}"
    ports:
      - "${DOCKER_APP_PORT:-8080}:80"
    volumes:
      - app-storage:/var/www/html/storage:ro
    networks:
      - frontend
      - backend
    depends_on:
      app:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/up"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  queue:
    <<: *app-service
    command:
      - php
      - artisan
      - queue:work
      - --sleep=3
      - --tries=3
      - --timeout=300
      - --max-time=3600
      - --no-interaction
    stop_grace_period: 5m

  scheduler:
    <<: *app-service
    command: ["php", "artisan", "schedule:work", "--no-interaction"]
    stop_grace_period: 1m

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${DOCKER_DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  app-storage:
    name: aureuserp-storage
  mysql-data:
    name: aureuserp-mysql
